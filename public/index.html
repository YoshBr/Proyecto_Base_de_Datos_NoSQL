<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorreosDB - Gestión de Paquetes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container-fluid px-4 my-5">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Sistema de Gestión de Envíos y Paquetes</h2>
      <p class="text-muted">CorreosDB — Plataforma Logística de Correos de Costa Rica</p>
    </div>

    <!-- Formulario -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="m-0" id="form-title">Registrar Nuevo Paquete</h5>
      </div>
      <div class="card-body">
        <form id="paquete-form">
          <input type="hidden" id="paquete-id">
          
          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <label class="form-label fw-semibold">Código Tracking</label>
              <input type="text" id="trackingCode" class="form-control" placeholder="Ej: CR-1001" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Nombre Remitente</label>
              <input type="text" id="remitente" class="form-control" placeholder="Ej: Juan Pérez / Tienda " required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Nombre Destinatario</label>
              <input type="text" id="destinatario" class="form-control" placeholder="Ej: María Rodríguez" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Sucursal de Origen</label>
              <input type="text" id="sucursalOrigen" class="form-control" placeholder="Ej: Sucursal San José Central" required>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label fw-semibold">Descripción del Contenido</label>
              <input type="text" id="descripcion" class="form-control" placeholder="Ej: Lote de Ropa / Repuestos" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Peso (kg)</label>
              <input type="number" step="0.1" id="pesoKg" class="form-control" placeholder="Ej: 2.5" min="0.1" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Estado del Envío</label>
              <select id="estado" class="form-select" required>
                <option value="En Bodega">En Bodega</option>
                <option value="En Tránsito">En Tránsito</option>
                <option value="Entregado">Entregado</option>
                <option value="Devuelto">Devuelto</option>
              </select>
            </div>
          </div>

          <div class="mt-4 text-end">
            <button type="button" class="btn btn-secondary d-none me-2" id="btn-cancelar" onclick="limpiarFormulario()">Cancelar</button>
            <button type="submit" class="btn btn-success" id="btn-guardar">Guardar Paquete</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white">
        <h5 class="m-0">Inventario Logístico de Paquetes</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped mb-0 align-middle">
            <thead class="table-secondary">
              <tr>
                <th>Tracking</th>
                <th>Remitente</th>
                <th>Destinatario</th>
                <th>Descripción</th>
                <th>Peso</th>
                <th>Sucursal</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-paquetes">
              <!-- Se puebla dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
